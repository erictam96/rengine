name: 🧪 Tests

on:
  push:
    branches: [master, 'release/**', 'modernize-**']
  pull_request:

permissions:
  contents: read

jobs:
  django:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: rengine
          POSTGRES_USER: rengine
          POSTGRES_PASSWORD: rengine
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rengine" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:alpine
        ports: ['6379:6379']
    env:
      POSTGRES_DB: rengine
      POSTGRES_USER: rengine
      POSTGRES_PASSWORD: rengine
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      CELERY_BROKER: redis://localhost:6379/0
      CELERY_BACKEND: redis://localhost:6379/0
      RENGINE_HOME: /tmp/rengine
      RENGINE_RESULTS: /tmp/rengine/scan_results
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: web/requirements.txt
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 nmap
      - name: Install requirements
        run: |
          mkdir -p "$RENGINE_RESULTS"
          pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check --fail-level ERROR
      - name: Migrations are complete
        run: python manage.py makemigrations --check --dry-run
      - name: Tests
        run: python manage.py test tests.test_modernization
